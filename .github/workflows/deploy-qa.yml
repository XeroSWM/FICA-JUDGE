name: Entrega Continua FICA-JUDGE (Docker Hub)

on:
  push:
    branches:
      - qa

jobs:
  # FASE 1: Integración Continua (Asegurar que el código compila)
  build-and-test:
    name: Validar Código (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build iam-service

  # FASE 2: Publicar Imagen en Docker Hub
  docker-publish:
    name: Construir y Subir a Docker Hub
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Empujar IAM Service
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.iam
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fica-iam-service:latest