name: Entrega Continua Monorepo (Docker Hub)

on:
  push:
    branches:
      - qa
    # Eliminamos el bloque 'paths' restrictivo. 
    # Ahora el pipeline evaluará todo el ecosistema al hacer push a QA.

jobs:
  # FASE 1: Integración Continua (Matriz Paralela)
  build-and-test:
    name: Validar Código (CI) - ${{ matrix.service }}
    runs-on: ubuntu-latest
    
    # 👇 LA MAGIA: Definimos la lista exacta de tus carpetas backend
    strategy:
      matrix:
        service: 
          - api-gateway
          - assignment-service
          - iam-service
          - problem-catalog-service
          - ranking-service
          - submission-service

    defaults:
      run:
        working-directory: ./fica-judge
        
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - run: npm install
      
      # Compila dinámicamente el servicio que esté iterando la matriz en este momento
      - run: npm run build ${{ matrix.service }} 

  # FASE 2: Publicar en Docker Hub
  docker-publish:
    name: Construir y Subir - ${{ matrix.service }}
    needs: build-and-test 
    runs-on: ubuntu-latest
    
    # 👇 Replicamos la misma matriz para crear una imagen Docker por cada servicio
    strategy:
      matrix:
        service: 
          - api-gateway
          - assignment-service
          - iam-service
          - problem-catalog-service
          - ranking-service
          - submission-service

    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Empujar Imagen
        uses: docker/build-push-action@v5
        with:
          context: ./fica-judge 
          # Apunta al Dockerfile exacto de la iteración actual
          file: ./fica-judge/apps/${{ matrix.service }}/Dockerfile 
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:qa-${{ github.sha }}